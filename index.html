<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commit Culture</title>
  <style>
    body {
      background-color: #0c0c0c;
      color: #39ff14;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 1rem;
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.5;
      animation: flicker 0.15s infinite;
    }
    
    @keyframes flicker {
      0% { opacity: 0.98; }
      50% { opacity: 1; }
      100% { opacity: 0.99; }
    }
    
    /* CRT Scanlines */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(
        to bottom,
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 50;
      pointer-events: none;
    }

    .glow {
      text-shadow: 0 0 4px rgba(57, 255, 20, 0.6);
    }

    .glitch {
      display: inline-block;
      animation: glitch 2s linear infinite;
      color: #ff0055;
    }

    @keyframes glitch {
      0%, 10% { transform: translate(0, 0) skew(0deg); }
      10.5% { transform: translate(-2px, 0) skew(-10deg); }
      11% { transform: translate(2px, 0) skew(5deg); }
      11.5% { transform: translate(0, 0) skew(0deg); }
      50%, 60% { transform: translate(0, 0) skew(0deg); }
      60.5% { transform: translate(3px, 0) skew(10deg); }
      61% { transform: translate(-3px, 0) skew(-5deg); }
      61.5% { transform: translate(0, 0) skew(0deg); }
    }
    
    .ascii-art {
      font-size: clamp(0.5rem, 1.4vw, 1.15rem);
      line-height: 1.1;
      background: linear-gradient(
        to right,
        #155915 0%,
        #39ff14 40%,
        #ffffff 50%,
        #39ff14 60%,
        #155915 100%
      );
      background-size: 300% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: dataScan 4s ease-in-out infinite alternate;
      font-weight: 900;
      display: inline-block;
      text-shadow: none; /* Removed glow so the scan effect is crisp */
    }

    @keyframes dataScan {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 100% center;
      }
    }
    
    pre {
      margin: 1rem 0;
      white-space: pre;
      font-weight: bold;
      overflow-x: hidden;
    }

    a {
      color: #39ff14;
      text-decoration: none;
      border-bottom: 1px dashed #39ff14;
    }
    
    a:hover {
      background: #39ff14;
      color: #000;
      border-bottom: 1px solid #39ff14;
    }

    #terminal {
      max-width: 800px;
      margin: 0 auto;
      padding-top: 2rem;
    }
    
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #39ff14;
      animation: blink 1s step-end infinite;
      vertical-align: bottom;
      box-shadow: 0 0 5px #39ff14;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .prompt {
      color: #ff0055; /* root user color */
      font-weight: bold;
    }
    .dir {
      color: #0055ff;
      font-weight: bold;
    }
    .text-muted {
      color: #888;
    }
  </style>
</head>
<body>
  <div id="terminal" class="glow"></div>
  
  <script>
    const ascii = `
   ____                          _ _      ____      _ _                  
  / ___|___  _ __ ___  _ __ ___ (_) |_   / ___|   _| | |_ _   _ _ __ ___ 
 | |   / _ \\| '_ \` _ \\| '_ \` _ \\| | __| | |  | | | | | __| | | | '__/ _ \\
 | |__| (_) | | | | | | | | | | | | |_  | |__| |_| | | |_| |_| | | |  __/
  \\____\\___/|_| |_| |_|_| |_| |_|_|\\__|  \\____\\__,_|_|\\__|\\__,_|_|  \\___|
`;

    // Simulated terminal output
    const lines = [
      { text: "<span class='prompt'>root@kali</span>:<span class='dir'>~</span># ./commit_culture.sh --init", type: 'html', delay: 400 },
      { text: "[*] Initializing Commit Culture framework v0.0.1-alpha...", type: 'type', delay: 20 },
      { text: "[+] Resolving dependencies....................... ", type: 'spinner', result: "<span style='color: #39ff14'>[OK]</span>", delay: 900 },
      { text: "[+] Establishing connection to builder community. ", type: 'spinner', result: "<span style='color: #39ff14'>[OK]</span>", delay: 1200 },
      { text: "[+] Bypassing talk filters....................... ", type: 'spinner', result: "<span style='color: #39ff14'>[SUCCESS]</span>", delay: 1500 },
      { text: "<span class='glitch'>[!] WARNING: HIGH LEVELS OF SHIPPING DETECTED</span>", type: 'html', delay: 400 },
      { text: " ", type: 'type', delay: 0 },
      { text: ascii, type: 'pre', delay: 10 },
      { text: "STATUS: COMING SOON", type: 'type', delay: 30 },
      { text: "MISSION: LESS TALKING. MORE SHIPPING.", type: 'type', delay: 30 },
      { text: " ", type: 'type', delay: 0 },
      { text: "> A community for developers, builders, hackers, and", type: 'type', delay: 15 },
      { text: "> curious people who like building things.", type: 'type', delay: 15 },
      { text: " ", type: 'type', delay: 0 },
      { text: "[*] Establishing contact vectors:", type: 'type', delay: 20 },
      { text: "    [1] Email:     <a href='mailto:hello@commitculture.dev'>hello@commitculture.dev</a>", type: 'html', delay: 200 },
      { text: "    [2] Instagram: <a href='https://www.instagram.com/commit.culture/' target='_blank'>@commit.culture</a>", type: 'html', delay: 200 },
      { text: "    [3] LinkedIn:  <a href='https://www.linkedin.com/company/commitculture/' target='_blank'>company/commitculture</a>", type: 'html', delay: 200 },
      { text: " ", type: 'type', delay: 0 },
      { text: "<span class='prompt'>root@kali</span>:<span class='dir'>~/commit-culture</span># <span class='cursor'></span>", type: 'end', delay: 0 }
    ];

    const term = document.getElementById('terminal');
    let lineIdx = 0;

    function typeWriter() {
      if (lineIdx >= lines.length) return;
      
      const line = lines[lineIdx];
      const div = document.createElement('div');
      
      if (line.type === 'end') {
        div.innerHTML = line.text;
        term.appendChild(div);
        return;
      }
      
      if (line.type === 'pre') {
        const pre = document.createElement('pre');
        pre.className = 'ascii-art';
        pre.textContent = line.text;
        term.appendChild(pre);
        lineIdx++;
        setTimeout(typeWriter, line.delay);
        return;
      }
      
      if (line.type === 'html') {
        div.innerHTML = line.text;
        term.appendChild(div);
        lineIdx++;
        setTimeout(typeWriter, line.delay);
        return;
      }
      
      if (line.type === 'spinner') {
        div.innerHTML = line.text;
        const spinSpan = document.createElement('span');
        div.appendChild(spinSpan);
        term.appendChild(div);
        
        const chars = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
        let c = 0;
        const intv = setInterval(() => {
          spinSpan.textContent = chars[c++ % chars.length];
        }, 50);
        
        setTimeout(() => {
          clearInterval(intv);
          spinSpan.outerHTML = line.result;
          lineIdx++;
          setTimeout(typeWriter, 150);
        }, line.delay);
        return;
      }
      
      if (line.type === 'type') {
        term.appendChild(div);
        let charIdx = 0;
        
        function typeChar() {
          if (charIdx < line.text.length) {
            div.textContent += line.text.charAt(charIdx);
            charIdx++;
            setTimeout(typeChar, line.delay);
          } else {
            lineIdx++;
            setTimeout(typeWriter, 150); // Pause between lines
          }
        }
        
        if (line.text === " ") {
          div.innerHTML = "&nbsp;";
          lineIdx++;
          setTimeout(typeWriter, 50);
        } else {
          typeChar();
        }
      }
    }
    
    setTimeout(typeWriter, 500); // Initial boot delay
  </script>
</body>
</html>
